<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sélon Coffee — Redirecting…</title>
  <script>
    (function () {
      var p = window.location.pathname;
      var s = window.location.search || '';
      var h = window.location.hash || '';
      // Forward path to SPA hash route
      var target = '/#' + (p.startsWith('/') ? p : '/' + p) + s + h;
      window.location.replace(target);
    })();
  </script>
  <meta http-equiv="refresh" content="0;URL='/'">
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0D0B0A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
  <p style="font-size: 1.1rem; opacity: 0.85;">Redirecting to position…</p>
</body>
</html>
